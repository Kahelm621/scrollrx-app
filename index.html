<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12"><title>ScrollRx — Scroll smarter.</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css"></head><body>
<header id="top"><div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"><b>ScrollRx</b></div>
<div class="stats"><span id="streak" title="Day streak">🔥 0</span><span id="xp" title="XP">⚡ 0</span>
<svg id="ring" viewBox="0 0 36 36" aria-label="Daily goal"><circle cx="18" cy="18" r="15" class="bg"/><circle cx="18" cy="18" r="15" class="fg" id="ringfg"/></svg></div></header>
<nav id="filters" role="tablist" aria-label="Topics"></nav>
<main id="feed" aria-live="polite"></main>
<section id="saved" class="panel" hidden><h2>Saved</h2><div id="savedlist"></div></section>
<section id="profile" class="panel" hidden></section>
<nav id="tabs"><button data-tab="feed" class="on">🏠<span>Feed</span></button><button data-tab="saved">🔖<span>Saved</span></button><button data-tab="profile">👤<span>Me</span></button></nav>
<div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
